name: Bug report
description: The hamster shows something wrong or does not show up
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead. A screenshot helps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Claude Code version
      description: The output of `claude --version`
      placeholder: 2.1.294
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options: [Terminal, Desktop app, VS Code, Mobile]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
